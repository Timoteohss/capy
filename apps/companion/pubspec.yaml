name: capy_companion
description: "Eaglemetry Companion for Android and iOS."
publish_to: "none"
version: 0.1.1+5
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  telemetry_core:
  capy_ui:
  path_provider: ^2.1.5
  # Account sign-in only. No telemetry leaves the phone: the car is still
  # the source and the archive is still local.
  supabase_flutter: ^2.17.2
  sqflite: ^2.4.3
  shared_preferences: ^2.5.5
  flutter_blue_plus: ^2.3.12
  pointycastle: ^3.9.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  generate: true
  # Inter is declared by `packages/capy_ui`. Do not redeclare it here:
  # a `packages/capy_ui/...` font path is a file relative to this
  # package, not the workspace root, and would fail to resolve.
